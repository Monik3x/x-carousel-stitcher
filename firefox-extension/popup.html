<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>X Carousel Stitcher</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <img src="icons/icon.svg" alt="" width="42" height="42" />
      <div>
        <h1>X Carousel Stitcher</h1>
        <p>Join photos from an X post into one image.</p>
      </div>
    </header>
    <main inert>
      <div id="perm-banner" class="banner hidden">
        <span>Allow access to fetch carousel images.</span>
        <button id="grant-perm-btn" type="button">Grant access</button>
      </div>
      <div class="source">
        <label for="url-input">Post link or ID</label>
        <span id="source-hint"></span>
        <div class="input-wrap">
          <svg class="icon" aria-hidden="true"><use href="icons/tools.svg#link"></use></svg>
          <input
            id="url-input"
            type="text"
            placeholder="https://x.com/user/status/…"
            autocomplete="off"
            spellcheck="false"
          />
          <button
            type="button"
            id="clear-source"
            aria-label="Clear post link or ID"
            title="Clear post link or ID"
          >
            ×
          </button>
        </div>
      </div>
      <fieldset class="layouts">
        <legend>Layout</legend>
        <div class="layout-choices">
          <label>
            <input type="radio" name="direction" value="horizontal" checked />
            <span>
              <svg class="icon" aria-hidden="true"><use href="icons/tools.svg#horizontal"></use></svg>
              Horizontal
            </span>
          </label>
          <label>
            <input type="radio" name="direction" value="vertical" />
            <span>
              <svg class="icon" aria-hidden="true"><use href="icons/tools.svg#vertical"></use></svg>
              Vertical
            </span>
          </label>
          <label>
            <input type="radio" name="direction" value="grid" />
            <span>
              <svg class="icon" aria-hidden="true"><use href="icons/tools.svg#grid"></use></svg>
              Grid
            </span>
          </label>
        </div>
      </fieldset>
      <div class="field hidden" id="cols-field">
        <label for="cols-input">Grid columns</label>
        <input id="cols-input" type="number" min="1" max="30" value="6" />
      </div>
      <div class="pair">
        <label class="field">
          File format
          <select id="format-select">
            <option value="png">PNG</option>
            <option value="jpeg">JPEG</option>
            <option value="webp">WebP</option>
          </select>
        </label>
        <label class="field">
          Max width
          <select id="max-width-select">
            <option value="0">Original size</option>
            <option value="16384">16,384 px</option>
            <option value="8192">8,192 px</option>
            <option value="4096">4,096 px</option>
            <option value="2048">2,048 px</option>
          </select>
        </label>
      </div>
      <div class="actions">
        <button id="download-btn" class="primary" type="button">
          <svg class="icon" aria-hidden="true"><use href="icons/tools.svg#download"></use></svg>
          Stitch &amp; download
        </button>
        <button id="viewer-btn" type="button">
          <svg class="icon" aria-hidden="true"><use href="icons/tools.svg#viewer"></use></svg>
          <span id="viewer-label">Open viewer</span>
        </button>
      </div>
      <div id="status" class="status hidden" role="status" aria-live="polite">
        <div class="progress-track hidden" id="progress-track"><div id="progress-bar"></div></div>
        <div id="status-text"></div>
      </div>
      <details>
        <summary>
          <svg class="icon" aria-hidden="true"><use href="icons/tools.svg#settings"></use></svg>
          <span>Stitch adjustments</span>
          <svg class="icon" aria-hidden="true"><use href="icons/tools.svg#chevron"></use></svg>
        </summary>
        <div class="settings-body">
          <div class="pair">
            <label class="field">
              Gap (px)
              <input id="gap-input" type="number" min="0" max="200" value="0" />
            </label>
            <label class="field">
              Trim overlap (px)
              <input
                id="overlap-input"
                aria-describedby="trim-help"
                type="number"
                min="0"
                max="400"
                value="0"
              />
            </label>
            <p id="trim-help"></p>
          </div>
          <label class="check">
            <input id="reverse-check" type="checkbox" />
            Reverse panel order
          </label>
        </div>
      </details>
    </main>
    <details class="preferences" inert>
      <summary>
        <svg class="icon" aria-hidden="true"><use href="icons/tools.svg#switch"></use></svg>
        <span>On-post button settings</span>
        <svg class="icon" aria-hidden="true"><use href="icons/tools.svg#chevron"></use></svg>
      </summary>
      <div class="settings-body">
        <label class="field">
          On click
          <select id="inline-action-select">
            <option value="viewer">Open viewer</option>
            <option value="download">Download image</option>
          </select>
        </label>
        <label class="field">
          Timeline position
          <select id="button-position-select">
            <option value="bookmark">Next to bookmark</option>
            <option value="header-auto">Top right, space permitting</option>
          </select>
        </label>
        <label class="check">
          <input id="compact-btn-check" type="checkbox" />
          Show icon only
        </label>
      </div>
    </details>
    <script src="lib/stitcher.js"></script>
    <script src="stitch-form.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
