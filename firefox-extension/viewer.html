<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>X Carousel Stitcher · Viewer</title>
    <link rel="stylesheet" href="viewer.css" />
  </head>
  <body data-view="empty">
    <header class="toolbar">
      <div class="top-row">
        <div class="brand">
          <img src="icons/icon.svg" alt="" width="31" height="31" />
          <span>X Carousel Stitcher</span>
        </div>
        <div id="toolbar-source"></div>
        <div class="action-group">
          <button id="copy-btn" disabled>
            <svg class="icon" aria-hidden="true"><use href="icons/tools.svg#copy"></use></svg>
            Copy PNG
          </button>
          <button id="download-btn" class="primary" disabled>
            <svg class="icon" aria-hidden="true"><use href="icons/tools.svg#download"></use></svg>
            Download
          </button>
        </div>
      </div>
      <div class="controls-row" aria-label="Stitch settings">
        <label class="ctrl">
          Layout
          <select id="direction-select">
            <option value="horizontal">Horizontal</option>
            <option value="vertical">Vertical</option>
            <option value="grid">Grid</option>
          </select>
        </label>
        <label class="ctrl hidden" id="cols-field">
          Grid columns
          <input id="cols-input" type="number" min="1" max="30" value="6" />
        </label>
        <label class="ctrl">
          File format
          <select id="format-select">
            <option value="png">PNG</option>
            <option value="jpeg">JPEG</option>
            <option value="webp">WebP</option>
          </select>
        </label>
        <label class="ctrl">
          Max width
          <select id="max-width-select">
            <option value="0">Original size</option>
            <option value="16384">16,384 px</option>
            <option value="8192">8,192 px</option>
            <option value="4096">4,096 px</option>
            <option value="2048">2,048 px</option>
          </select>
        </label>
        <details class="adjustments">
          <summary>
            <svg class="icon" aria-hidden="true"><use href="icons/tools.svg#settings"></use></svg>
            Stitch adjustments
          </summary>
          <div class="adjustment-fields">
            <label class="ctrl">
              Gap (px)
              <input id="gap-input" type="number" min="0" max="200" value="0" />
            </label>
            <label class="ctrl">
              Trim overlap (px)
              <input
                id="overlap-input"
                type="number"
                min="0"
                max="400"
                value="0"
                aria-describedby="trim-help"
              />
            </label>
            <label class="check">
              <input id="reverse-check" type="checkbox" />
              Reverse panel order
            </label>
            <span id="trim-help"></span>
          </div>
        </details>
      </div>
    </header>
    <div id="perm-banner" class="banner hidden">
      <span>Allow access to fetch carousel images.</span>
      <button id="grant-perm-btn">Grant access</button>
    </div>
    <main id="viewport" class="viewport">
      <div id="empty-state" class="empty-state">
        <div class="empty-art" aria-hidden="true">
          <i></i>
          <i></i>
          <i></i>
        </div>
        <h1>Stitch a carousel</h1>
        <p>Join photos from an X post into one full-resolution image.</p>
        <div id="empty-source">
          <form id="source-form" class="url-group">
            <label for="url-input">Post link or ID</label>
            <div class="url-field">
              <svg class="icon" aria-hidden="true"><use href="icons/tools.svg#link"></use></svg>
              <input
                id="url-input"
                type="text"
                placeholder="https://x.com/user/status/…"
                autocomplete="off"
                spellcheck="false"
              />
              <button
                type="button"
                id="clear-source"
                aria-label="Clear post link or ID"
                title="Clear post link or ID"
              >
                ×
              </button>
            </div>
            <button id="load-btn" type="submit" disabled>Load post</button>
          </form>
        </div>
      </div>
      <div id="loading-state" class="overlay-card hidden" role="status">
        <div id="loading-text">Loading…</div>
        <div class="progress-track"><div id="progress-bar"></div></div>
      </div>
      <div id="error-state" class="overlay-card error-card hidden" role="alert">
        <h2>Couldn't stitch this post</h2>
        <p id="error-text"></p>
      </div>
      <div id="stage" class="stage hidden"><img id="preview-img" alt="Stitched X carousel" /></div>
    </main>
    <footer class="statusbar">
      <div class="meta-group">
        <div id="meta-info">Ready</div>
        <a id="source-link" class="hidden" href="#" target="_blank" rel="noopener noreferrer">
          Original post ↗
        </a>
      </div>
      <span id="toast" role="status"></span>
      <div class="zoom-group" role="group" aria-label="Preview zoom">
        <div class="zoom-presets">
          <button id="fit-height-btn" title="Fit height for panning" aria-pressed="false">Fit height</button>
          <button id="fit-width-btn" title="Fit full width" aria-pressed="false">Fit width</button>
          <button id="zoom-100-btn" title="Show at 100%" aria-pressed="false">Actual size</button>
        </div>
        <div class="zoom-steps">
          <button id="zoom-out-btn" aria-label="Zoom out">−</button>
          <span id="zoom-label">100%</span>
          <button id="zoom-in-btn" aria-label="Zoom in">+</button>
        </div>
      </div>
    </footer>
    <script src="lib/stitcher.js"></script>
    <script src="stitch-form.js"></script>
    <script src="viewer.js"></script>
  </body>
</html>
